name: 刷步数

on:
  workflow_dispatch:
    inputs:
      cronjob_id:
        description: 'cron-job.org 任务 ID（外部触发时传入，手动触发留空）'
        required: false
        default: ''
      hour:
        description: '该任务固定的小时（北京时间，0-23）'
        required: false
        default: ''



jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: 检查本小时是否已执行
        id: hour_check
        if: ${{ github.event.inputs.cronjob_id != '' }}
        run: |
          NOW=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H')
          if [ -f .last_run_hour ] && [ "$(cat .last_run_hour)" = "$NOW" ]; then
            echo "本小时($NOW)已执行过，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        if: steps.hour_check.outputs.skip != 'true'
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: 记录执行小时
        if: steps.hour_check.outputs.skip != 'true'
        run: TZ=Asia/Shanghai date '+%Y-%m-%d %H' > .last_run_hour

      - name: persist tokens
        if: steps.hour_check.outputs.skip != 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "persist tokens trigger by ${{ github.event_name }}"
          git push origin master

      - name: 随机化下次触发分钟
        if: ${{ always() && github.event.inputs.cronjob_id != '' && steps.hour_check.outputs.skip != 'true' }}
        env:
          CJ_KEY: ${{ secrets.CRONJOB_API_KEY }}
          JOB_ID: ${{ github.event.inputs.cronjob_id }}
          HOUR: ${{ github.event.inputs.hour }}
        run: |
          if [ -z "$CJ_KEY" ]; then
            echo "未配置 CRONJOB_API_KEY，跳过随机改期"
            exit 0
          fi
          MIN=$((RANDOM % 60))
          echo "将任务 $JOB_ID 下次执行改为北京时间 $HOUR 点 $MIN 分"
          curl -sS -X PATCH \
            -H "Authorization: Bearer $CJ_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"job\":{\"schedule\":{\"timezone\":\"Asia/Shanghai\",\"expiresAt\":0,\"hours\":[$HOUR],\"minutes\":[$MIN],\"mdays\":[-1],\"months\":[-1],\"wdays\":[-1]}}}" \
            "https://api.cron-job.org/jobs/$JOB_ID"
